services:
  folio:
    build: .
    image: folio:latest
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes: ["./data:/data"]
    environment:
      # Set both to "1" when serving over HTTPS behind a reverse proxy (Caddy, nginx, Traefik, Plesk).
      FOLIO_SECURE_COOKIES: "0"
      FOLIO_TRUST_PROXY: "0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
